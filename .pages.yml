media:
  input: public/media
  output: /media
  rename: safe
  categories: [image]

content:
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename:
      template: "{slug}.md"
      field: false
    view:
      primary: title
      fields: [title, category, publishedAt, draft]
      sort: publishedAt
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Use lowercase words separated by hyphens.
      - name: subtitle
        label: Subtitle
        type: text
      - name: excerpt
        label: Excerpt
        type: text
        required: true
      - name: category
        label: Category
        type: string
        required: true
        default: Engineering
      - name: publishedAt
        label: Publish date
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss.SSSxxx"
      - name: readingTime
        label: Reading time
        type: number
        required: true
        default: 6
        description: Approximate minutes.
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: draft
        label: Draft
        type: boolean
        default: true
        description: Draft articles are committed but excluded from the published site.
      - name: body
        label: Content
        type: rich-text
        required: true
        options:
          format: markdown
          rename: safe
          switcher: true
